name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e . pytest
      - name: Scorer kit tests
        run: python -m pytest -q tools/switchbench_kit/tests
      - name: Pre-registration hashes
        run: sh prereg/verify_prereg.sh
